<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Radar Pro｜A股交易雷达</title><style>:root{--bg:#07101d;--card:#101c2d;--line:#263b56;--text:#edf4ff;--muted:#8b9ab0;--blue:#4f8cff;--red:#ff5c72;--green:#38d39f;--gold:#ffc85b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -20%,#18345e,transparent 32%),var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand h1{margin:0;font-size:28px}.brand b{color:var(--blue)}.brand p,.hint{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px;color:var(--text);min-width:210px}.btn,.tab{border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.btn{background:var(--blue);color:#fff}.status{margin-top:10px;color:var(--green);font-size:12px}.nav{display:flex;gap:8px;margin:20px 0}.tab{background:var(--card);border:1px solid var(--line);color:var(--muted)}.tab.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px}.card{background:linear-gradient(145deg,#122238,#0e1929);border:1px solid var(--line);border-radius:15px;padding:16px}h2{font-size:17px;margin:0 0 13px}.value{font-size:28px;font-weight:750;margin:7px 0}.up{color:var(--red)}.down{color:var(--green)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 7px;border-bottom:1px solid var(--line);text-align:left}.table th{font-size:12px;color:var(--muted)}.code{font-size:11px;color:var(--muted)}.score{color:var(--gold);font-weight:700}.badge{border:0;background:#20344e;color:#dce8f8;padding:5px 8px;border-radius:6px}.hidden{display:none}.empty{text-align:center;padding:30px;color:var(--muted)}.tag{display:inline-block;background:#243750;padding:4px 7px;border-radius:5px;margin:2px;font-size:11px}.footer{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.7}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.top{display:block}}@media(max-width:520px){.app{padding:12px}.grid{grid-template-columns:1fr}.search{width:100%;min-width:0}.table{font-size:12px}}</style></head><body><main class="app"><header class="top"><div class="brand"><h1>Trade <b>Radar</b> Pro</h1><p>A股连板 · 二波 · 主升浪交易雷达</p></div><div class="actions"><input id="search" class="search" placeholder="输入股票代码，如 000001"><button class="btn" onclick="lookup()">查询</button><button class="btn" onclick="load()">刷新</button></div></header><div id="status" class="status">● 正在读取扫描数据…</div><nav class="nav"><button class="tab active" data-p="market">市场总览</button><button class="tab" data-p="lianban">连板雷达</button><button class="tab" data-p="second">二波启动</button><button class="tab" data-p="mainrise">主升浪</button><button class="tab" data-p="trend">综合候选</button><button class="tab" data-p="watch">自选股</button></nav><section id="market"><div class="grid" id="metrics"></div><div class="layout"><div class="card"><h2>市场状态</h2><table class="table"><thead><tr><th>指标</th><th>数值</th></tr></thead><tbody id="marketRows"></tbody></table></div><div class="card"><h2>数据机制</h2><p class="hint">后台扫描器在A股交易日自动运行，约5分钟更新一次；前端每60秒检查最新JSON。周六、周日不运行。</p><p class="hint">扫描结果由历史K线 + 当日行情计算，不再只是简单按涨幅排序。</p></div></div></section><section id="lianban" class="hidden"><div class="card"><h2>🔥 连板雷达</h2><div id="lianbanBox"></div></div></section><section id="second" class="hidden"><div class="card"><h2>🚀 二波启动雷达</h2><div id="secondBox"></div></div></section><section id="mainrise" class="hidden"><div class="card"><h2>📈 主升浪雷达</h2><div id="mainBox"></div></div></section><section id="trend" class="hidden"><div class="card"><h2>🎯 综合候选池</h2><div id="trendBox"></div></div></section><section id="watch" class="hidden"><div class="card"><h2>⭐ 自选股</h2><div id="watchBox" class="empty"></div></div></section><section id="detail" class="card hidden" style="margin-top:14px"></section><div class="footer">Trade Radar Pro · 行情源：公开行情接口 · 扫描频率受GitHub Actions调度影响，属于准实时而非交易所逐笔实时 · 仅供研究，不构成投资建议。</div></main><script>let D=null,watch=JSON.parse(localStorage.getItem('trWatch')||'[]');const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('zh-CN',{maximumFractionDigits:2}),pct=n=>(Number(n)||0).toFixed(2)+'%',cls=n=>Number(n)>=0?'up':'down';function table(a){if(!a||!a.length)return '<div class="empty">当前没有符合条件的标的</div>';return '<table class="table"><thead><tr><th>股票</th><th>现价</th><th>涨幅</th><th>成交额</th><th>评分</th><th>信号</th></tr></thead><tbody>'+a.map(x=>'<tr><td><b>'+x.name+'</b><div class="code">'+x.code+'</div></td><td>'+fmt(x.price)+'</td><td class="'+cls(x.pct)+'">'+pct(x.pct)+'</td><td>'+fmt(x.amount/1e8)+'亿</td><td class="score">'+x.score+'</td><td>'+(x.tags||[]).map(t=>'<span class="tag">'+t+'</span>').join('')+'</td></tr>').join('')+'</tbody></table>'}function render(){if(!D)return;const m=D.market||{};$('metrics').innerHTML='<div class="card"><div class="hint">股票数量</div><div class="value">'+fmt(m.stock_count)+'</div></div><div class="card"><div class="hint">涨停</div><div class="value up">'+fmt(m.limit_up)+'</div></div><div class="card"><div class="hint">跌停</div><div class="value down">'+fmt(m.limit_down)+'</div></div><div class="card"><div class="hint">全市场平均涨幅</div><div class="value '+cls(m.avg_pct)+'">'+pct(m.avg_pct)+'</div></div>';$('marketRows').innerHTML='<tr><td>数据时间</td><td>'+D.updated_at+'</td></tr><tr><td>数据源</td><td>'+D.source+'</td></tr><tr><td>扫描模式</td><td>历史K线 + 实时行情</td></tr>';const r=D.radar||{};$('lianbanBox').innerHTML=table(r.lianban);$('secondBox').innerHTML=table(r.second_wave);$('mainBox').innerHTML=table(r.main_rise);$('trendBox').innerHTML=table(r.trend);renderWatch();$('status').textContent='● 数据已更新：'+D.updated_at+' · 下次自动检查约60秒后'}async function load(){try{const r=await fetch('data/market.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();D=await r.json();render()}catch(e){$('status').textContent='● 暂无后台扫描数据；可等待下一次交易日扫描或点击刷新'}renderWatch()}function addWatch(code,name){if(!watch.some(x=>x.code===code)){watch.push({code,name});localStorage.setItem('trWatch',JSON.stringify(watch));renderWatch()}}function del(code){watch=watch.filter(x=>x.code!==code);localStorage.setItem('trWatch',JSON.stringify(watch));renderWatch()}function renderWatch(){$('watchBox').innerHTML=watch.length?'<table class="table"><thead><tr><th>股票</th><th>代码</th><th></th></tr></thead><tbody>'+watch.map(x=>'<tr><td>'+x.name+'</td><td>'+x.code+'</td><td><button class="badge" onclick="del(\''+x.code+'\')">删除</button></td></tr>').join('')+'</tbody></table>':'还没有自选股'}async function lookup(){const c=$('search').value.trim();if(!/^\d{6}$/.test(c)){alert('请输入6位股票代码');return}try{const r=await fetch('https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=5000&po=1&np=1&fltt=2&invt=2&fid=f3&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23&fields=f2,f3,f6,f12,f14');const j=await r.json(),s=(j.data?.diff||[]).find(x=>x.f12===c);$('detail').classList.remove('hidden');$('detail').innerHTML=s?'<h2>'+s.f14+' <span class="code">'+s.f12+'</span></h2><p>现价：<b>'+fmt(s.f2)+'</b>　涨跌：<b class="'+cls(s.f3)+'">'+pct(s.f3)+'</b>　成交额：<b>'+fmt(s.f6/1e8)+'亿</b></p><button class="btn" onclick="addWatch(\''+s.f12+'\',\''+s.f14+'\')">加入自选</button>':'<div class="empty">未找到该股票</div>'}catch(e){$('detail').classList.remove('hidden');$('detail').innerHTML='<div class="empty">行情接口暂时不可用</div>'}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('section[id]').forEach(x=>x.classList.add('hidden'));$(b.dataset.p).classList.remove('hidden')});load();setInterval(load,60000);</script></body></html>
