<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trade Radar Pro</title><style>:root{--bg:#090d16;--card:#111827;--line:#263247;--text:#eef3fa;--muted:#8794a8;--blue:#4f7cff;--red:#ff5d73;--gold:#f6ba4c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}.app{max-width:1450px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:26px}h1 span{color:var(--blue)}p{color:var(--muted)}.status{background:#15251b;color:#79dc92;padding:8px 12px;border-radius:20px}.tabs{display:flex;gap:8px;overflow:auto}.tab{padding:9px 15px;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:8px}.tab.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.label{color:var(--muted)}.value{font-size:29px;font-weight:700;margin-top:8px}.red{color:var(--red)}.gold{color:var(--gold)}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}h2{font-size:18px;margin:0 0 12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:400}.score{color:var(--gold);font-weight:700}.badge{background:#202c40;padding:4px 7px;border-radius:6px;font-size:12px}.sector{padding:12px 0;border-bottom:1px solid var(--line)}.sectorTop{display:flex;justify-content:space-between}.bar{height:7px;background:#222d40;border-radius:8px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.note{color:var(--muted);line-height:1.8}@media(max-width:800px){.grid,.layout{grid-template-columns:1fr 1fr}.layout{display:block}.layout .card{margin-bottom:14px}}@media(max-width:520px){.top{display:block}.status{display:inline-block;margin-top:10px}.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><header class="top"><div><h1>Trade <span>Radar</span> Pro</h1><p>A股交易雷达 · 连板 · 二波 · 主升浪</p></div><div class="status">● V1 已启动 · 演示模式</div></header><div class="tabs"><button class="tab active">市场总览</button><button class="tab">连板雷达</button><button class="tab">二波启动</button><button class="tab">主升浪</button><button class="tab">自选股</button></div><section class="grid"><div class="card"><div class="label">涨停家数</div><div class="value red">--</div></div><div class="card"><div class="label">连板最高</div><div class="value">--</div></div><div class="card"><div class="label">市场情绪</div><div class="value">等待数据</div></div><div class="card"><div class="label">候选池</div><div class="value gold">--</div></div></section><section class="layout"><div class="card"><h2>🎯 今日候选池</h2><table><thead><tr><th>股票</th><th>形态</th><th>评分</th><th>状态</th></tr></thead><tbody><tr><td colspan="4" style="text-align:center;color:#8794a8;padding:30px">等待真实行情接入</td></tr></tbody></table></div><div class="card"><h2>🔥 强势板块</h2><div class="note">强势板块将在行情数据接入后，根据涨停数量、涨幅、成交额和持续性自动计算。</div></div></section><section class="layout"><div class="card"><h2>📡 V1 雷达评分模型</h2><div class="sector"><div class="sectorTop"><span>趋势突破</span><b class="score">25分</b></div><div class="bar"><i style="width:25%"></i></div></div><div class="sector"><div class="sectorTop"><span>均线结构</span><b class="score">25分</b></div><div class="bar"><i style="width:25%"></i></div></div><div class="sector"><div class="sectorTop"><span>量能变化</span><b class="score">25分</b></div><div class="bar"><i style="width:25%"></i></div></div><div class="sector"><div class="sectorTop"><span>资金活跃度</span><b class="score">25分</b></div><div class="bar"><i style="width:25%"></i></div></div></div><div class="card"><h2>⚠️ 下一阶段</h2><p class="note">① 接入真实A股行情<br>② 自动识别涨停与连板<br>③ 二波启动扫描器<br>④ 主升浪评分引擎<br>⑤ 自选股与交易观察池</p></div></section></main><script>document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelector('.tab.active').classList.remove('active');x.classList.add('active')})</script></body></html>
